<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F3F3F0">
<title>Quy trình công nghệ — Ghế Gudhjem</title>
<style>
  :root{
    --bg:#F3F3F0;
    --surface:#FFFFFF;
    --surface-2:#FAFAF8;
    --border:#DFDFDA;
    --text:#1C1C1A;
    --text-secondary:#5A5A54;
    --text-muted:#8A8A82;
    --accent:#2F5D82;
    --accent-bg:#E7EEF3;
    --warn:#B5711F;
    --warn-bg:#FBF0E2;
    --danger:#dc2626;
    --danger-bg:#fee2e2;
    --success:#16a34a;
    --mono: SFMono-Regular, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:20px 14px 60px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  header{margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-end;}
  header .label{font-size:12px;color:var(--text-muted);}
  header h1{font-size:20px;font-weight:600;margin:2px 0 0;}

  .machine-status-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .machine-status-badge.online { color: var(--success); border-color: rgba(22, 163, 74, 0.3); }
  .machine-status-badge.offline { color: var(--danger); border-color: rgba(220, 38, 38, 0.3); background: var(--danger-bg); }

  .tabs{display:flex; gap:6px; margin-bottom:14px; background:var(--surface-2); padding:4px; border-radius:10px; border:1px solid var(--border);}
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:8px 0;
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    border-radius:8px;
    cursor:pointer;
  }
  .tab-btn.active{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,0.06);}

  details{
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    margin-bottom:10px;
    overflow:hidden;
  }
  details[open] > summary{border-bottom:1px solid var(--border);}
  summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  summary::-webkit-details-marker{display:none;}
  summary .chev{transition:transform .15s ease; color:var(--text-muted); font-size:13px; flex:0 0 auto;}
  details[open] > summary .chev{transform:rotate(90deg);}

  .avatar{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-secondary);
    font-weight:600;
    flex:0 0 auto;
  }
  .avatar.product{width:44px;height:44px;font-size:15px;border-radius:10px;}

  .product-head{display:flex; align-items:center; gap:10px; min-width:0;}
  .product-info{display:flex; flex-direction:column; min-width:0;}
  .name{font-weight:600;font-size:15px;}
  .subtitle{display:block;font-weight:400;font-size:11px;color:var(--text-muted);margin-top:2px;}

  .badge{
    font-size:10px;
    padding:2px 7px;
    border-radius:5px;
    background:var(--warn-bg);
    color:var(--warn);
    font-weight:600;
    margin-left:8px;
  }

  .metrics{display:flex; gap:18px; padding:0 14px 12px;}
  .metric .k{font-size:10px;color:var(--text-secondary);}
  .metric .v{font-family:var(--mono); font-size:16px; font-weight:600; margin-top:2px;}

  .ct-left{display:flex; flex-direction:column; min-width:0;}
  .ct-metrics{display:flex; gap:8px; font-family:var(--mono); font-size:12px; color:var(--text-secondary); flex-wrap:wrap; justify-content:flex-end;}
  .child-list{padding:0 10px 10px 10px;}

  .step-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    border-radius:8px;
    margin-top:6px;
    background:var(--surface-2);
    flex-wrap:wrap;
    gap:6px;
    cursor:pointer;
  }
  .step-row:hover{background:var(--accent-bg);}
  .step-row .step-left{display:flex; align-items:center; gap:8px;}
  .step-row .step-name{font-size:13px;}
  .step-row .step-metrics{display:flex; gap:10px; font-family:var(--mono); font-size:12px; color:var(--text-secondary);}
  .sx-value.live{color:var(--accent); font-weight:700;}

  .status{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:12px;
    font-size:11px;
    line-height:1;
    flex:0 0 auto;
  }
  .status.live{color:var(--success);}
  .status.live::before{
    content:"\25CF";
    animation:pulse 1.4s ease-in-out infinite;
  }
  .status.offline{color:var(--danger);}
  .status.offline::before{content:"\25CF";}
  .status.settled{color:var(--text-muted);}
  .status.settled::before{content:"\2713";}

  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.35;}
  }

  .legend{display:flex; gap:16px; font-size:11px; color:var(--text-muted); margin-bottom:14px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}

  .back-btn{
    border:none;
    background:none;
    color:var(--accent);
    font-size:13px;
    padding:0 0 12px;
    cursor:pointer;
  }
  .history-title{font-size:16px; font-weight:600; margin:0 0 2px;}
  .history-sub{font-size:12px; color:var(--text-muted); margin:0 0 14px;}
  .history-table{
    width:100%;
    border-collapse:collapse;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    font-size:13px;
  }
  .history-table th, .history-table td{
    padding:8px 10px;
    text-align:left;
    border-bottom:1px solid var(--border);
  }
  .history-table th{
    font-size:11px;
    color:var(--text-secondary);
    font-weight:600;
    background:var(--surface-2);
  }
  .history-table td{font-family:var(--mono);}
  .history-table tr:last-child td{border-bottom:none;}

  .alert-banner {
    display: none;
    background: var(--danger-bg);
    color: #991b1b;
    border: 1px solid rgba(220,38,38,0.3);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="alert-banner" class="alert-banner"></div>

  <header>
    <div>
      <div class="label">Quy trình công nghệ — Tổ định hình</div>
      <h1>Ghế Gudhjem</h1>
    </div>
    <div id="machine-pill" class="machine-status-badge">
      <span id="machine-dot" class="status settled"></span>
      <span id="machine-status-text">Đang kết nối...</span>
    </div>
  </header>

  <div class="tabs">
    <button id="btn-live" class="tab-btn active" onclick="switchTab('live')">Trực tiếp</button>
    <button id="btn-history" class="tab-btn" onclick="switchTab('history')">Lịch sử máy A</button>
  </div>

  <div id="tab-live">
    <div class="legend">
      <span><span class="status live" aria-hidden="true"></span>Máy A đang chạy</span>
      <span><span class="status offline" aria-hidden="true"></span>Máy A mất tín hiệu</span>
      <span><span class="status settled" aria-hidden="true"></span>Công đoạn chốt</span>
    </div>
    <div id="tree"></div>
  </div>

  <div id="tab-history" style="display:none;">
    <button class="back-btn" onclick="switchTab('live')">← Quay lại</button>
    <h2 id="history-title" class="history-title">Lịch sử máy A</h2>
    <p id="history-ma" class="history-sub">Các bản ghi mới nhất từ máy</p>
    <table class="history-table">
      <thead><tr><th>Thời điểm</th><th>Mã máy</th><th>Tổng đếm</th></tr></thead>
      <tbody id="history-tbody">
        <tr><td colspan="3" style="text-align:center;">Đang tải dữ liệu...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = "https://nhieidisubjhwarhowdx.supabase.co/rest/v1";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oaWVpZGlzdWJqaHdhcmhvd2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODM5ODksImV4cCI6MjEwNjQ1OTk4OX0.u1x9yPEX_jaIm-IUdrVtNwfvb4euEU6mbOP9AuAb3Go";

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY
};

const sanPhamData = { ten: "Ghế Gudhjem" };

const chiTietData = [
  {
    ma: "CT01",
    ten: "Chân trước",
    congDoan: [
      { ma: "xxx01", ten: "Cắt", daSanXuat: 950 },
      { ma: "xxx02", ten: "Dập (Máy A)", machineId: "A", daSanXuat: 0, active: true },
      { ma: "xxx03", ten: "Khoan lỗ", daSanXuat: 400 }
    ]
  },
  {
    ma: "CT02",
    ten: "Tay vịn",
    congDoan: [
      { ma: "yyy01", ten: "Cắt", daSanXuat: 860 },
      { ma: "yyy02", ten: "Uốn", daSanXuat: 845 },
      { ma: "yyy03", ten: "Hàn", daSanXuat: 830 },
      { ma: "yyy04", ten: "Đánh bóng", daSanXuat: 810 }
    ]
  }
];

let machineAOnline = false;

// Hàm tự động phát hiện trường thời gian trong dòng dữ liệu
function extractTime(row) {
  const possibleKeys = ['created_at', 'thoi_gian', 'thoi_diem', 'timestamp', 'time', 'ngay_tao', 'ngay'];
  for (const k of possibleKeys) {
    if (row[k]) return new Date(row[k]);
  }
  for (const k in row) {
    if (typeof row[k] === 'string' && !isNaN(Date.parse(row[k])) && row[k].length >= 10) {
      return new Date(row[k]);
    }
  }
  return null;
}

function tinhCongDoan(list) {
  return list.map((cd, i) => {
    const daSuDung = i + 1 < list.length ? list[i + 1].daSanXuat : 0;
    return Object.assign({}, cd, { daSuDung: daSuDung, conTon: cd.daSanXuat - daSuDung });
  });
}

function tinhChiTiet(ct) {
  const congDoan = tinhCongDoan(ct.congDoan);
  const cuoi = congDoan[congDoan.length - 1];
  return Object.assign({}, ct, {
    congDoan: congDoan,
    daSanXuat: cuoi.daSanXuat,
    daSuDung: 0,
    conTon: cuoi.daSanXuat
  });
}

function fmt(n) {
  return (n || 0).toLocaleString('vi-VN');
}

function initials(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function metricHtml(label, value) {
  return '<div class="metric"><div class="k">' + label + '</div><div class="v">' + fmt(value) + '</div></div>';
}

function stepRowHtml(cd, ctLabel) {
  let statusClass = 'settled';
  let sxClass = '';
  
  if (cd.active) {
    statusClass = machineAOnline ? 'live' : 'offline';
    sxClass = ' live';
  }

  return (
    '<div class="step-row" onclick="openHistory(\'' + cd.ten + '\',\'' + ctLabel + '\')">' +
      '<div class="step-left">' +
        '<span class="status ' + statusClass + '" aria-hidden="true"></span>' +
        '<span class="step-name">' + cd.ten + '</span>' +
      '</div>' +
      '<div class="step-metrics">' +
        '<span>SX <span class="sx-value' + sxClass + '">' + fmt(cd.daSanXuat) + '</span></span>' +
        '<span>SD ' + fmt(cd.daSuDung) + '</span>' +
        '<span>Tồn ' + fmt(cd.conTon) + '</span>' +
      '</div>' +
    '</div>'
  );
}

function chiTietHtml(ct, laNutThat) {
  const badge = laNutThat ? '<span class="badge">Điểm nghẽn</span>' : '';
  const ctLabel = ct.ma + '_' + ct.ten;
  return (
    '<details open>' +
      '<summary>' +
        '<div class="ct-left">' +
          '<div class="name">' + ctLabel + badge + '</div>' +
          '<small class="subtitle">' + ct.congDoan.length + ' công đoạn</small>' +
        '</div>' +
        '<div class="ct-metrics">' +
          '<span>SX ' + fmt(ct.daSanXuat) + '</span>' +
          '<span>SD ' + fmt(ct.daSuDung) + '</span>' +
          '<span>Còn ' + fmt(ct.conTon) + '</span>' +
        '</div>' +
        '<span class="chev">▸</span>' +
      '</summary>' +
      '<div class="child-list">' +
        ct.congDoan.map(function (cd) { return stepRowHtml(cd, ctLabel); }).join('') +
      '</div>' +
    '</details>'
  );
}

function render() {
  const chiTietTinh = chiTietData.map(tinhChiTiet);
  const daSanXuatSanPham = Math.min.apply(null, chiTietTinh.map(ct => ct.daSanXuat));
  const nutThat = chiTietTinh.find(ct => ct.daSanXuat === daSanXuatSanPham);

  const html =
    '<details open>' +
      '<summary>' +
        '<div class="product-head">' +
          '<div class="avatar product">' + initials(sanPhamData.ten) + '</div>' +
          '<div class="product-info">' +
            '<div class="name">' + sanPhamData.ten + '</div>' +
            '<small class="subtitle">Sản phẩm — đồng bộ đủ chi tiết</small>' +
          '</div>' +
        '</div>' +
        '<span class="chev">▸</span>' +
      '</summary>' +
      '<div class="metrics">' +
        metricHtml('Đã đồng bộ', daSanXuatSanPham) +
        metricHtml('Đã Ráp hàn', 0) +
        metricHtml('Còn lại', daSanXuatSanPham) +
      '</div>' +
      '<div class="child-list">' +
        chiTietTinh.map(ct => chiTietHtml(ct, ct === nutThat)).join('') +
      '</div>' +
    '</details>';

  document.getElementById('tree').innerHTML = html;
}

// === TRUY VẤN MỚI NHẤT DỰA VÀO CỘT ID (KHÔNG CẦN CREATED_AT) ===
async function fetchSupabaseLatest() {
  const banner = document.getElementById("alert-banner");
  try {
    // Sắp xếp theo ID giảm dần để lấy dòng mới nhất
    const url = `${SUPABASE_URL}/du_lieu_may?ma_may=eq.A&order=id.desc&limit=1`;
    const res = await fetch(url, { headers: HEADERS });
    
    if (!res.ok) {
      const errDetail = await res.text();
      throw new Error(`HTTP ${res.status}: ${errDetail}`);
    }

    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      banner.style.display = "block";
      banner.innerHTML = "<b>Không tìm thấy dữ liệu:</b> Bảng <code>du_lieu_may</code> đang không có dòng nào có <code>ma_may = 'A'</code> hoặc đang bị chặn quyền đọc RLS.";
      updateMachineStatus(false, "Chưa có dữ liệu");
      return;
    }

    banner.style.display = "none";
    const latestRow = data[0];
    const tongDem = Number(latestRow.tong_dem) || 0;

    // Tính thời gian từ dòng mới nhất
    const timeObj = extractTime(latestRow);
    let timeText = "Đang nhận tín hiệu";
    if (timeObj) {
      const diffSeconds = Math.floor((Date.now() - timeObj.getTime()) / 1000);
      machineAOnline = diffSeconds <= 30;
      timeText = diffSeconds < 60 ? `${diffSeconds}s trước` : `${Math.floor(diffSeconds / 60)}p trước`;
    } else {
      machineAOnline = true; // Có dữ liệu mới theo id
    }

    updateMachineStatus(machineAOnline, timeText);

    // Cập nhật số vào công đoạn Dập
    const ct01 = chiTietData.find(c => c.ma === "CT01");
    if (ct01) {
      const cdDap = ct01.congDoan.find(cd => cd.machineId === "A");
      if (cdDap) cdDap.daSanXuat = tongDem;
    }

    render();

  } catch (err) {
    banner.style.display = "block";
    banner.innerHTML = "<b>Lỗi kết nối:</b> " + err.message;
    updateMachineStatus(false, "Mất kết nối");
  }
}

function updateMachineStatus(isOnline, timeText) {
  const pill = document.getElementById("machine-pill");
  const dot = document.getElementById("machine-dot");
  const txt = document.getElementById("machine-status-text");

  pill.className = "machine-status-badge " + (isOnline ? "online" : "offline");
  dot.className = "status " + (isOnline ? "live" : "offline");
  txt.textContent = isOnline ? `Máy A hoạt động (${timeText})` : `Máy A dừng (${timeText})`;
}

async function loadHistoryTab() {
  const tbody = document.getElementById("history-tbody");
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Đang tải...</td></tr>';
  try {
    const url = `${SUPABASE_URL}/du_lieu_may?ma_may=eq.A&order=id.desc&limit=15`;
    const res = await fetch(url, { headers: HEADERS });
    const data = await res.json();

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Chưa có dòng dữ liệu nào</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(row => {
      const t = extractTime(row);
      const timeStr = t ? (t.toLocaleTimeString("vi-VN") + " " + t.toLocaleDateString("vi-VN")) : ("Bản g
